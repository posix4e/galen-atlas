name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pergamap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate data and sources
        run: |
          python3 tools/validate.py
          python3 tools/check_bbaw_drift.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check static site
        run: python3 tools/check_site.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Build deployment directory
        if: steps.creds.outputs.have == 'yes'
        run: |
          mkdir -p /tmp/pergamap-dist
          rsync -a --exclude '.git' --exclude '.github' --exclude '.cache' --exclude '__pycache__' ./ /tmp/pergamap-dist/
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.have == 'yes'
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d2737c32f76407d6a6b1c0381f7e91c
          command: >-
            pages deploy /tmp/pergamap-dist --project-name=pergamap
            --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
            --commit-hash=${{ github.sha }}
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.creds.outputs.have == 'yes'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const url = `${{ steps.deploy.outputs.deployment-url }}`;
            const marker = '<!-- pergamap-preview -->';
            const body = `${marker}\n**Preview deployed:** ${url}\n\n(Every push to this PR updates it.)`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(comment => comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
