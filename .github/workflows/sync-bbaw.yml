name: sync BBAW catalogue

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-bbaw-catalogue
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download and normalize BBAW catalogue
        run: python3 tools/sync_bbaw.py --timeout 30
      - name: Validate refreshed snapshot
        run: |
          python3 tools/validate.py
          python3 -m unittest discover -s tests -v
          python3 tools/check_site.py
      - name: Open or update snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/bbaw-galen-translations.json; then
            echo "BBAW index is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="data/sync-bbaw-catalogue"
          remote_sha="$(git ls-remote --heads origin "$branch" | cut -f1)"
          git switch -C "$branch"
          git add data/bbaw-galen-translations.json
          git commit -m "Refresh BBAW Galen translation catalogue"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:$branch"
          else
            git push origin "HEAD:$branch"
          fi
          if gh pr view "$branch" --json url --jq .url >/dev/null 2>&1; then
            gh pr edit "$branch" --title "Refresh BBAW Galen translation catalogue" --body "Automated weekly refresh of the attributed BBAW/CMG metadata index. CI reports any new disagreement with Pergamap's editorial catalogue for human review."
          else
            gh pr create --base main --head "$branch" --title "Refresh BBAW Galen translation catalogue" --body "Automated weekly refresh of the attributed BBAW/CMG metadata index. CI reports any new disagreement with Pergamap's editorial catalogue for human review."
          fi
