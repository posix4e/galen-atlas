name: sync BBAW catalogue

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bbaw-catalogue
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download and normalize BBAW catalogue
        run: python3 tools/sync_bbaw.py --timeout 30
      - name: Validate refreshed snapshot
        run: |
          python3 tools/validate.py
          python3 -m unittest discover -s tests -v
          python3 tools/check_site.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/bbaw-galen-translations.json; then
            echo "BBAW index is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bbaw-galen-translations.json
          git commit -m "Refresh BBAW Galen translation catalogue"
          git push
